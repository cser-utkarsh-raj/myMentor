<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="greekNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00f0ff" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Badge Frame -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#09090d" stroke="#000000" stroke-width="5" filter="url(#badgeGlow)"/>
  
  <!-- Greek Odyssey Lowercase 'm' Motif -->
  <!-- Left Pillar -->
  <path d="M 28 68 V 38 C 28 32 32 28 37 28 C 42 28 46 32 46 38 V 68" 
        fill="none" 
        stroke="url(#greekNeonGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Right Pillar & Odyssey Meander Arch Loop -->
  <path d="M 46 44 C 48 34 54 28 62 28 C 70 28 74 33 74 40 V 68" 
        fill="none" 
        stroke="url(#greekNeonGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Greek Pillar Capital Accent Dots -->
  <circle cx="28" cy="38" r="2.5" fill="#00f0ff"/>
  <circle cx="46" cy="38" r="2.5" fill="#ff0055"/>
  <circle cx="74" cy="40" r="2.5" fill="#ffe600"/>
</svg>
