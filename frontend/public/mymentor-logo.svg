<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Solid Dark Square Badge with Rounded Corners & Black Border -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#09090d" stroke="#000000" stroke-width="4.5" />
  
  <!-- Subtle Dot Grid Background Pattern -->
  <circle cx="16" cy="16" r="1.5" fill="#ffffff" opacity="0.15" />
  <circle cx="48" cy="16" r="1.5" fill="#ffffff" opacity="0.15" />
  <circle cx="16" cy="48" r="1.5" fill="#ffffff" opacity="0.15" />
  <circle cx="48" cy="48" r="1.5" fill="#ffffff" opacity="0.15" />

  <!-- Shadow Offset Layer for M -->
  <path d="M 15 48 V 20 L 32 37 L 49 20 V 48" stroke="#000000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sleek Artistic Dual Neon 'M' Strokes -->
  <!-- Outer Cyan Stroke -->
  <path d="M 15 48 V 20 L 32 37 L 49 20 V 48" stroke="#00f0ff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Inner Pink Accent Vertex Core -->
  <path d="M 23.5 29 L 32 37.5 L 40.5 29" stroke="#ff0055" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Top Center Energy Point -->
  <circle cx="32" cy="15" r="3" fill="#ffe600" stroke="#000000" stroke-width="1.5" />
</svg>
