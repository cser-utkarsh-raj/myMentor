<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="mGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="mGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="mGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <!-- Dark Solid Container Block with Shadow -->
  <rect x="8" y="8" width="84" height="84" rx="20" fill="#000000" />
  <rect x="6" y="6" width="84" height="84" rx="20" fill="#0a0a0f" stroke="#000000" stroke-width="5" />

  <!-- Background Cyber Pattern Lines -->
  <line x1="16" y1="26" x2="80" y2="26" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" />
  <line x1="16" y1="70" x2="80" y2="70" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" />

  <!-- Artistic Geometric 'M' Facets with Thick Outlines -->
  <!-- Left Pillar -->
  <path d="M 22 74 V 26 L 36 26 V 74 Z" fill="url(#mGrad1)" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" />
  
  <!-- Left Inner Diagonal Peak -->
  <path d="M 36 26 L 50 56 L 36 44 Z" fill="url(#mGrad2)" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Right Inner Diagonal Peak -->
  <path d="M 64 26 L 50 56 L 64 44 Z" fill="url(#mGrad3)" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Center Vertex Drop Gem -->
  <polygon points="50,42 58,56 50,70 42,56" fill="#ffe600" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Right Pillar -->
  <path d="M 64 26 V 74 L 78 74 V 26 Z" fill="url(#mGrad1)" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Top Accent Crown Points -->
  <circle cx="29" cy="22" r="4.5" fill="#ffe600" stroke="#000000" stroke-width="3" />
  <circle cx="50" cy="18" r="5" fill="#ff0055" stroke="#000000" stroke-width="3" />
  <circle cx="71" cy="22" r="4.5" fill="#00f0ff" stroke="#000000" stroke-width="3" />
</svg>
