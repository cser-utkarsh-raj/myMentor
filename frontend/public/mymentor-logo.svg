<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Vibrant Cyber-Mentor Dual Gradients -->
    <linearGradient id="mCyanPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    
    <linearGradient id="mPinkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Solid Neobrutalist Dark Badge -->
  <rect x="7" y="7" width="86" height="86" rx="24" fill="#08080d" stroke="#000000" stroke-width="4.5" filter="url(#coreGlow)"/>

  <!-- Sleek Modern Lowercase 'm' - Left Stem & Arch -->
  <path d="M 28 72 V 42 C 28 33 34 28 42 28 C 50 28 54 34 54 42 V 72" 
        fill="none" 
        stroke="url(#mCyanPink)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Sleek Modern Lowercase 'm' - Right Arch & Ascending Apex -->
  <path d="M 54 50 C 57 37 63 28 72 28 C 79 28 82 34 82 43 V 72" 
        fill="none" 
        stroke="url(#mPinkGold)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Ascending Spark Node (Symbolizing Mentorship & Growth) -->
  <polygon points="72,21 75,27 81,30 75,33 72,39 69,33 63,30 69,27" fill="#00f0ff"/>
</svg>
