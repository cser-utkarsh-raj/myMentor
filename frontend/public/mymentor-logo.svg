<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberPointyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Pitch-Black Octagonal / Rounded Badge Frame -->
  <rect x="7" y="7" width="86" height="86" rx="20" fill="#08080c" stroke="#000000" stroke-width="4.5" filter="url(#cyberGlow)"/>

  <!-- Pointy Cyber Lowercase 'm' Symbol -->
  <!-- Left stem rising, sharp pointy 1st arch peak at (38,24), center junction, sharp 2nd arch peak at (64,24), right stem down to (76,72) -->
  <path d="M 24 72 V 44 L 38 24 L 50 46 V 72 M 50 46 L 64 24 L 76 46 V 72" 
        fill="none" 
        stroke="url(#cyberPointyGrad)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Futuristic Pointy Apex Spark Dots -->
  <circle cx="38" cy="24" r="3.5" fill="#00f0ff"/>
  <circle cx="64" cy="24" r="3.5" fill="#ff0055"/>
  <circle cx="76" cy="72" r="3.5" fill="#ffe600"/>
</svg>
