<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <filter id="hyperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Badge -->
  <rect x="8" y="8" width="84" height="84" rx="20" fill="#09090e" stroke="#000000" stroke-width="4.5" filter="url(#hyperGlow)"/>

  <!-- Ultra-Minimal Geometric Cyber Lowercase 'm' Glyph -->
  <!-- Left stem: vertical pill -->
  <rect x="25" y="40" width="9" height="32" rx="4.5" fill="url(#cyberRibbon)"/>

  <!-- Arch 1: Smooth geometric bridge connecting stem 1 and 2 -->
  <path d="M 29.5 44 C 29.5 32 46.5 32 46.5 44 V 72" 
        fill="none" 
        stroke="url(#cyberRibbon)" 
        stroke-width="9" 
        stroke-linecap="round"/>

  <!-- Arch 2: Parallel geometric bridge connecting stem 2 and 3 -->
  <path d="M 46.5 44 C 46.5 32 63.5 32 63.5 44 V 72" 
        fill="none" 
        stroke="url(#cyberRibbon)" 
        stroke-width="9" 
        stroke-linecap="round"/>

  <!-- Futuristic Glowing Core Node -->
  <circle cx="63.5" cy="40" r="3" fill="#ffe600"/>
</svg>
